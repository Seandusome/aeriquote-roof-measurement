name: Apply area outline correction
on:
  push:
    paths:
      - '.github/workflows/apply-area-outline-correction.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply and validate targeted patch
        run: |
          python scripts/fix_area_outline_correction.py
          python -m py_compile app.py
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Add editable saved area outlines for all service industries"
          git push
