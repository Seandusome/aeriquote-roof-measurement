name: Validate AeriQuote application

on:
  push:
    paths:
      - 'app.py'
      - '.github/workflows/pressure-washing-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate app.py syntax
        run: python -m py_compile app.py
