name: Isolated browser crash and recovery QA
on:
  push:
    branches: [landscaping-multi-area-recovery-oct11]
    paths:
      - .github/workflows/qa-browser-crash-recovery.yml
      - scripts/test_*browser*.cjs
      - app.py
      - workspace_drafts.py
      - workspace_drafts.js
      - site/trial-signup.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/landscaping-multi-area-recovery-oct11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, recovery, pdf-failure, public, property-failure, drafts, draft-races, roof-exports]
    env:
      DATABASE_URL: ''
      QA_BROWSER_WIDTHS: 1440,390
      QA_BROWSER_IMAGES: hide
      QA_BROWSER_ALL_PDFS: '1'
      QA_BROWSER_OUTPUT: /tmp/aq-browser-evidence
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt geographiclib==2.1
      - run: npm install --no-save --package-lock=false playwright@1.62.1 leaflet@1.9.4 html2canvas@1.4.1 jspdf@4.2.1
      - run: npx playwright install --with-deps chromium
      - name: Disposable browser workflow with fictional providers
        shell: bash
        run: |
          python scripts/prelaunch_browser_server.py > /tmp/qa-browser-server.log 2>&1 &
          task_server_pid=$!
          trap 'kill "$task_server_pid" || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for _ in range(80):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/dealer-login',timeout=1)
                  break
              except OSError:
                  time.sleep(.25)
          else:
              print(open('/tmp/qa-browser-server.log').read())
              raise RuntimeError('Disposable QA server did not start')
          PY
          case '${{ matrix.suite }}' in
            roof-exports) node scripts/test_manual_roofing_browser.cjs ;;
            draft-races) node scripts/test_draft_races_browser.cjs ;;
            drafts) node scripts/test_workspace_drafts_browser.cjs ;;
            baseline) node scripts/test_prelaunch_browser.cjs ;;
            recovery) node scripts/test_browser_recovery.cjs ;;
            pdf-failure) node scripts/test_pdf_failure_browser.cjs ;;
            public) node scripts/test_browser_public_errors.cjs ;;
            property-failure) node scripts/test_property_failure_browser.cjs ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-browser-${{ matrix.suite }}
          path: |
            /tmp/aq-browser-evidence
            /tmp/qa-browser-server.log
          retention-days: 14
