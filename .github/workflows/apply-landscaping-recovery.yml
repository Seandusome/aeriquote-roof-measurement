name: Apply Landscaping Recovery to Recovery Branch
on:
  push:
    branches: [landscaping-multi-area-recovery-oct11]
    paths: [scripts/apply_landscaping_recovery.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landscaping-multi-area-recovery-oct11
      - run: python scripts/apply_landscaping_recovery.py
      - run: python -m py_compile app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Restore landscaping saved areas in pricing and estimate imagery"
          git push origin HEAD:landscaping-multi-area-recovery-oct11
