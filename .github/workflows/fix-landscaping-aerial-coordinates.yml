name: Fix landscaping aerial mosaic coordinates
on:
  push:
    branches: [aeriquote-commercial-multi-area-development]
    paths: ['.github/workflows/fix-landscaping-aerial-coordinates.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aeriquote-commercial-multi-area-development
      - name: Fix mosaic latitude conversion and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          old='const toLatLng=(px,py)=>L.latLng(mercatorLat(2*Math.PI*(.5-py/scale)),px/scale*360-180);'
          new='const toLatLng=(px,py)=>L.latLng(mercatorLat(py/scale),px/scale*360-180);'
          assert s.count(old)==1, f'Expected exactly one original mosaic coordinate conversion, found {s.count(old)}'
          s=s.replace(old,new,1)
          assert s.count(old)==0, 'Original coordinate conversion still present after replacement'
          assert s.count(new)>=1, 'Corrected coordinate conversion missing after replacement'
          p.write_text(s)
          PY
          python -m py_compile app.py
      - name: Commit correction to commercial test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix satellite mosaic latitude placement in landscaping map"
          git push origin HEAD:aeriquote-commercial-multi-area-development
