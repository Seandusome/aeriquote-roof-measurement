<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeriQuote phone layout QA</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#e8edf3;color:#172b45;font:16px Arial,sans-serif}header{max-width:1100px;margin:0 auto 12px}h1{font-size:20px;margin:0 0 8px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px}select,button{font:inherit;padding:8px;border:1px solid #a2afbf;border-radius:6px;background:white}p{font-size:14px;margin:10px 0}iframe{display:block;width:390px;height:780px;border:1px solid #6b7d91;background:white;margin:0 auto;box-shadow:0 3px 12px #0002}.stage{overflow:auto;padding:4px 0 16px}</style></head>
<body><header><h1>AeriQuote phone layout QA</h1><div class="controls"><label>Screen width <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option></select></label><label>Page <select id="page"><option value="/?industry=roofing">Roofing workspace</option><option value="/?industry=snow">Snow workspace</option><option value="/?industry=pressure">Pressure workspace</option><option value="/?industry=paving">Paving workspace</option><option value="/?industry=landscaping">Landscaping workspace</option><option value="/?industry=commercial" selected>Commercial workspace</option><option value="/site/index.html">Website</option></select></label><button id="load">Open page</button></div><p>Layout inspection only. Uses the normal signed-in app inside a fixed-width frame. No device or touch emulation. Changes inside the app save normally.</p></header><div class="stage"><iframe id="phone" title="Phone width AeriQuote" src="/?industry=commercial"></iframe></div><script>const phone=document.getElementById('phone');document.getElementById('width').onchange=e=>phone.style.width=e.target.value+'px';document.getElementById('load').onclick=()=>phone.src=document.getElementById('page').value;</script></body></html>
